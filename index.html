<style>
:root{--bg:#F7F5F1;--card:#fff;--ink:#3A4246;--muted:#8A9195;--line:#E9E6E0;--accent:#7F9A8B;--accent-soft:#E7EEE9;--accent-ink:#3F5A4C;--r:20px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{scroll-behavior:smooth}
header{position:sticky;top:0;z-index:10;background:rgba(247,245,241,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 0 8px}
.top{display:flex;align-items:center;gap:12px;padding:0 20px 8px}
h1{font-size:17px;font-weight:600;margin:0;white-space:nowrap;letter-spacing:-.01em;color:var(--ink)}
#count{font-size:13px;color:var(--muted);white-space:nowrap}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;font-size:16px;height:38px;padding:0 12px 0 34px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
.search input::placeholder{color:#A6ACAF}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(127,154,139,.15)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.4}
.row{display:flex;flex-wrap:nowrap;white-space:nowrap;gap:10px;overflow-x:auto;padding:5px 20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.row .lbl{flex:none;font-size:11px;font-weight:600;color:var(--muted);align-self:center;min-width:52px;text-transform:uppercase;letter-spacing:.06em}
.f{flex:none;font-size:15px;height:34px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#5A6266;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.f[aria-pressed=true]{background:var(--accent-soft);border-color:#B9CBBF;color:var(--accent-ink);font-weight:600}
#notice{display:none;margin:16px 20px 0;padding:12px 16px;border-radius:14px;background:#FBF6EA;color:#7A6640;font-size:15px;max-width:600px}
@media(min-width:640px){#notice{margin:16px auto 0}}
main{padding:24px 20px 56px;display:grid;gap:28px;max-width:600px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid #EFECE7;box-shadow:0 1px 3px rgba(40,45,48,.04),0 4px 14px rgba(40,45,48,.04)}
.ph{aspect-ratio:3/2;background:linear-gradient(135deg,#ECEFEE,#F3EEE6);display:block;width:100%;object-fit:cover}
.body{padding:20px 22px 22px}
.name{font-size:20px;font-weight:650;line-height:1.35;margin:0 0 12px;color:#2F363A}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.c{font-size:13px;font-weight:600;padding:4px 11px;border-radius:999px;background:#F0F2F3;color:#4A565C;opacity:.92}
.desc{margin:0 0 16px;font-size:17px;color:#4A5357}
.meta{display:grid;gap:8px;margin:0 0 16px;font-size:16px;color:#4A5357}
.meta div{display:flex;gap:10px}
.meta b{flex:none;color:var(--muted);font-weight:500;min-width:52px}
.meta a{color:var(--accent-ink);text-decoration-color:#B9CBBF;text-underline-offset:3px}
ul{margin:0 0 18px;padding-left:20px;color:#5A6266}
li{margin:4px 0}
li::marker{color:#B5BBBE}
.btn{display:block;text-align:center;text-decoration:none;font-size:16px;font-weight:600;padding:13px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);border:1px solid #D3E0D7}
.btn:active{background:#DCE7E0}
.empty{text-align:center;color:var(--muted);padding:48px 10px}
</style>
</head>

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

  var t=resp.table, labels=t.cols.map(function(c){return c.label||""}), rows=t.rows.map(function(r){return (r.c||[]).map(function(c){return c?(c.v!=null?c.v:""):""})});

function buildRow(id,field,values){
  var row=document.getElementById(id);row.querySelectorAll(".f").forEach(function(b){b.remove()});
  ["All"].concat(values).forEach(function(v){var b=document.createElement("button");b.className="f";b.textContent=v;b.setAttribute("aria-pressed",String(state[field]===v));
    b.onclick=function(){state[field]=v;row.querySelectorAll(".f").forEach(function(o){o.setAttribute("aria-pressed",String(o===b))});render();window.scrollTo({top:0,behavior:"smooth"})};row.appendChild(b)});
}
function uniq(f,order){var s={};items.forEach(function(x){if(x[f])s[x[f]]=1});var v=Object.keys(s);return v.sort(function(a,b){var ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b)})}
function start(data,live){
  items=data;
  buildRow("f-cat","cat",uniq("cat",Object.keys(CAT)));
  buildRow("f-who","who",["Couple","Friends","Both"]);
  buildRow("f-io","io",uniq("io",["Indoor","Both","Outdoor"]));
  var n=document.getElementById("notice");
  if(!live){n.style.display="block";n.textContent="Showing a saved copy. Live updates start once the sheet is shared as “Anyone with the link can view”."}else n.style.display="none";
  render();
}
document.getElementById("q").addEventListener("input",function(e){state.q=e.target.value.trim().toLowerCase();render()});
var done=false;
window.__onSheet=function(resp){if(done)return;try{if(resp.status==="error")throw 0;var d=fromGviz(resp);if(!d.length)throw 0;done=true;start(d,true)}catch(e){fallback()}};
function fallback(){if(done)return;done=true;start(fromObjects(SNAPSHOT),false)}
var s=document.createElement("script");
s.src="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json;responseHandler:__onSheet&headers=1&sheet="+encodeURIComponent(TAB)+"&_="+Date.now();
s.onerror=fallback;document.head.appendChild(s);setTimeout(fallback,8000);
})();
</script>
