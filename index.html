<html lang="en">
<head>

<title>Free Time Ideas</title>
<style>
:root{--bg:#F7F5F1;--card:#fff;--ink:#3A4246;--muted:#8A9195;--line:#E9E6E0;--accent:#7F9A8B;--accent-soft:#E7EEE9;--accent-ink:#3F5A4C;--r:20px}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip;max-width:100%;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{scroll-behavior:smooth}
header{position:sticky;top:0;z-index:10;background:rgba(247,245,241,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 0 8px}
.top{display:flex;align-items:center;gap:10px;padding:0 12px 6px}
h1{font-size:17px;font-weight:600;margin:0;white-space:nowrap;letter-spacing:-.01em;color:var(--ink)}
#count{font-size:13px;color:var(--muted);white-space:nowrap}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;font-size:16px;height:36px;padding:0 10px 0 32px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
.search input::placeholder{color:#A6ACAF}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(127,154,139,.15)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.4}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:3px 12px;max-width:100%}
.row .lbl{flex:none;font-size:10px;font-weight:600;color:var(--muted);width:38px;text-transform:uppercase;letter-spacing:.05em}
.f{flex:none;font-size:14px;line-height:1;height:32px;min-width:38px;padding:0 10px;white-space:nowrap;border-radius:999px;border:1px solid var(--line);background:#fff;color:#5A6266;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.f[aria-pressed=true]{background:var(--accent-soft);border-color:#B9CBBF;color:var(--accent-ink);font-weight:600}
#notice{display:none;margin:16px 20px 0;padding:12px 16px;border-radius:14px;background:#FBF6EA;color:#7A6640;font-size:15px;max-width:600px}
@media(min-width:640px){#notice{margin:16px auto 0}}
main{padding:24px 20px 56px;display:grid;gap:28px;max-width:600px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid #EFECE7;box-shadow:0 1px 3px rgba(40,45,48,.04),0 4px 14px rgba(40,45,48,.04)}
.ph{aspect-ratio:3/2;background:linear-gradient(135deg,#ECEFEE,#F3EEE6);display:block;width:100%;object-fit:cover}
.body{padding:20px 22px 22px}
.name{font-size:20px;font-weight:650;line-height:1.35;margin:0 0 12px;color:#2F363A}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.c{font-size:13px;font-weight:600;padding:4px 11px;border-radius:999px;background:#F0F2F3;color:#4A565C;opacity:.92}
.desc{margin:0 0 16px;font-size:17px;color:#4A5357}
.meta{display:grid;gap:8px;margin:0 0 16px;font-size:16px;color:#4A5357}
.meta div{display:flex;gap:10px}
.meta b{flex:none;color:var(--muted);font-weight:500;min-width:52px}
.meta a{color:var(--accent-ink);text-decoration-color:#B9CBBF;text-underline-offset:3px}
ul{margin:0 0 18px;padding-left:20px;color:#5A6266}
li{margin:4px 0}
li::marker{color:#B5BBBE}
.btn{display:block;text-align:center;text-decoration:none;font-size:16px;font-weight:600;padding:13px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);border:1px solid #D3E0D7}
.btn:active{background:#DCE7E0}
.rp{font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;border:1px solid #E3E0DA;color:#8A9195;background:transparent}
.done{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:3px 11px;margin:0 0 14px}
details.arch{margin-top:8px;border-top:1px solid var(--line);padding-top:20px}
details.arch summary{cursor:pointer;list-style:none;font-size:15px;font-weight:600;color:var(--muted);padding:12px 16px;border:1px dashed #DCD8D1;border-radius:14px;text-align:center}
details.arch summary::-webkit-details-marker{display:none}
details.arch[open] summary{margin-bottom:24px}
.arch-list{display:grid;gap:24px}
.card.muted{opacity:.62;box-shadow:none}
.card.muted .ph{filter:grayscale(.5);aspect-ratio:3/1}
.body,.name,.desc,.meta,li{overflow-wrap:anywhere}
.phw{position:relative}
.liked{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);color:#C2456E;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card.nope{opacity:.55}
.card.nope .ph{filter:grayscale(.6)}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:4px 0 12px;background:#FBFAF8}
.sb{flex:1;min-width:0;height:40px;font-size:14px;border:0;border-right:1px solid var(--line);background:transparent;color:#5A6266;cursor:pointer;padding:0 4px;white-space:nowrap}
.sb:last-child{border-right:0}
.sb[aria-pressed=true]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.ab{height:32px;font-size:13px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#6A7276;cursor:pointer;white-space:nowrap}
.ab[aria-pressed=true]{background:var(--accent-soft);border-color:#B9CBBF;color:var(--accent-ink);font-weight:600}
.det{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;font-size:15px;font-weight:600;border-radius:12px;border:1px solid var(--line);background:#FBFAF8;color:#4A5357;cursor:pointer}
.det[aria-expanded=true]{background:#F3F1EC}
.chev{font-size:12px;color:#8A9195}
.more{margin-top:16px;padding-top:16px;border-top:1px solid #F0EDE8}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;max-width:calc(100% - 32px);background:#3A4246;color:#fff;font-size:14px;padding:10px 16px;border-radius:12px;transition:opacity .2s,transform .2s;z-index:50;text-align:center}
#toast.show{opacity:.95;transform:translate(-50%,0)}
#toast.ok{background:#4F6B5C}#toast.err{background:#9C3B3B}#toast.info{background:#6B6157}
.empty{text-align:center;color:var(--muted);padding:48px 10px}
</style>
</head>

function url(u){u=String(u||"").trim();return /^https?:\/\//i.test(u)?u:""}
function key(s){return String(s||"").toLowerCase().replace(/[^a-z]/g,"")}
function pick(o,names){for(var i=0;i<names.length;i++){var k=key(names[i]);if(o[k]!=null&&o[k]!=="")return o[k]}return ""}
function norm(o){
  var cost=pick(o,["Cost (SGD)","Cost"]);
  return {name:String(pick(o,["Idea","Name"])).trim(),desc:pick(o,["Description"]),notes:pick(o,["Notes"]),status:String(pick(o,["Status"])||"").trim(),
    cost:cost,io:pick(o,["Indoor/Outdoor"]),where:pick(o,["Where"]),cat:pick(o,["Category"]),who:pick(o,["Who"]),
    repeat:pick(o,["Repeat"]),reaction:String(pick(o,["Reaction"])||"").trim(),hidden:/^(true|yes|1|x)$/i.test(String(pick(o,["Hidden"]))),
    row:Number(pick(o,["Sheet Row"]))||0,photo:url(pick(o,["Photo URL"])),link:url(pick(o,["Link URL"]))};
}
function fromObjects(arr){return arr.map(function(r){var o={};for(var k in r)o[key(k)]=r[k];return norm(o)}).filter(function(x){return x.name})}
function fromGviz(resp){
  var t=resp.table, labels=t.cols.map(function(c){return c.label||""}), rows=t.rows.map(function(r){return (r.c||[]).map(function(c){return c?(c.v!=null?c.v:""):""})}), off=2;
  if(!labels.some(function(l){return key(l)==="idea"})&&rows.length){labels=rows.shift().map(String);off=2}
  return fromObjects(rows.map(function(r,i){var o={"Sheet Row":i+off};labels.forEach(function(l,j){if(l)o[l]=r[j]});return o}));
}
function money(v){if(v===""||v==null)return "";var n=Number(String(v).replace(/[^0-9.\-]/g,""));if(isNaN(n))return "";return n===0?"Free":"S$"+n.toFixed(2)}
function chip(t,map){if(!t)return "";var c=map[t]||(map===ST&&/^done/i.test(t)?["#DFF5E3","#1E6B34"]:null)||["#EEF1F3","#34444D"];return '<span class="c" style="background:'+c[0]+';color:'+c[1]+'">'+esc(t)+'</span>'}
function isAddress(w){w=String(w||"").trim();return w&&!/^(home|online|tbc|tba|various|-)$/i.test(w)}
function isDone(x){return /^done/i.test(x.status)}
function isArchived(x){return !x.hidden&&isDone(x)&&/^one/i.test(String(x.repeat||"").trim())}
var STATUSES=["Want to try","Booked","Done"], open={};
function statusOf(x){var s=x.status.toLowerCase();if(/^done/.test(s))return "Done";if(/^book/.test(s))return "Booked";return "Want to try"}
function card(x,mode){
  var i=items.indexOf(x), notes=String(x.notes||"").split(/\n+/).map(function(s){return s.replace(/^\s*[•\-\*]\s*/,"").trim()}).filter(Boolean);
  var cost=money(x.cost), nope=x.reaction==="Not for us", liked=x.reaction==="Like", isOpen=!!open[x.name];
  var h='<article class="card'+(mode?' muted':'')+(nope&&!mode?' nope':'')+'" data-i="'+i+'">';
  h+='<div class="phw">'+(x.photo?'<img class="ph" loading="lazy" decoding="async" src="'+esc(x.photo)+'" alt="" onerror="this.removeAttribute(\'src\')">':'<div class="ph"></div>')+(liked?'<span class="liked" title="We like this">♥</span>':'')+'</div>';
  h+='<div class="body"><h2 class="name">'+esc(x.name)+'</h2><div class="chips">'+chip(x.cat,CAT)+chip(x.who,WHO)+chip(x.io,IO)+chip(x.status,ST)+(x.repeat?'<span class="c rp">'+esc(x.repeat)+'</span>':'')+(nope?'<span class="c rp">Not for us</span>':'')+'</div>';
  if(!mode&&isDone(x)&&!isArchived(x)&&!x.hidden)h+='<div class="done">Done ✓ <span style="color:#8A9195">· done before, worth repeating</span></div>';
  if(x.desc)h+='<p class="desc">'+esc(x.desc)+'</p>';
  var st=statusOf(x);
  h+='<div class="seg" role="group" aria-label="Status">'+STATUSES.map(function(s){return '<button class="sb" data-act="status" data-v="'+s+'" aria-pressed="'+(s===st)+'">'+s+'</button>'}).join("")+'</div>';
  h+='<div class="acts"><button class="ab" data-act="like" aria-pressed="'+liked+'">👍 Like</button><button class="ab" data-act="nope" aria-pressed="'+nope+'">👎 Not for us</button><button class="ab" data-act="hide" aria-pressed="'+x.hidden+'">'+(x.hidden?'Unhide':'Hide')+'</button></div>';
  h+='<button class="det" data-act="details" aria-expanded="'+isOpen+'">'+(isOpen?'Hide details':'Details')+'<span class="chev">'+(isOpen?'▴':'▾')+'</span></button>';
  if(isOpen){
    var m="";
    if(x.where){m+='<div><b>Where</b><span>'+(isAddress(x.where)?'<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.where+", Singapore")+'" target="_blank" rel="noopener">'+esc(x.where)+' ↗</a>':esc(x.where))+'</span></div>'}
    if(cost)m+='<div><b>Cost</b><span>'+cost+'</span></div>';
    h+='<div class="more">'+(m?'<div class="meta">'+m+'</div>':'')+(notes.length?'<ul>'+notes.map(function(n){return '<li>'+esc(n)+'</li>'}).join("")+'</ul>':'')+(x.link?'<a class="btn" href="'+esc(x.link)+'" target="_blank" rel="noopener">Open link</a>':'')+(!m&&!notes.length&&!x.link?'<p class="desc" style="color:#8A9195">No extra details yet.</p>':'')+'</div>';
  }
  return h+'</div></article>';
}
function matches(x){
  if(state.cat!=="All"&&x.cat!==state.cat)return false;
  if(state.io!=="All"&&x.io!==state.io)return false;
  if(state.who!=="All"){if(state.who==="Both"){if(x.who!=="Both")return false}else if(x.who!==state.who&&x.who!=="Both")return false}
  if(state.q){var hay=[x.name,x.desc,x.notes,x.where,x.cat].join(" ").toLowerCase();if(hay.indexOf(state.q)<0)return false}
  return true;
}
function section(cls,label,arr,mode){
  if(!arr.length)return "";
  var wasOpen=!!document.querySelector("details."+cls+"[open]");
  return '<details class="arch '+cls+'"'+(wasOpen?' open':'')+'><summary>'+label+'</summary><div class="arch-list">'+arr.map(function(x){return card(x,mode)}).join("")+'</div></details>';
}
function render(){
  var all=items.filter(matches), list=all.filter(function(x){return !x.hidden&&!isArchived(x)}), arch=all.filter(isArchived), hid=all.filter(function(x){return x.hidden});
  document.getElementById("count").textContent=list.length+"/"+items.filter(function(x){return !x.hidden&&!isArchived(x)}).length;
  var h=list.length?list.map(function(x){return card(x,"")}).join(""):'<p class="empty">No ideas match these filters.</p>';
  h+=section("archsec","Archive · "+arch.length+" done",arch,"arch");
  h+=section("hidsec","Hidden · "+hid.length,hid,"hidden");
  document.getElementById("list").innerHTML=h;
}
var toastT;
function toast(msg,kind){var t=document.getElementById("toast");t.textContent=msg;t.className="show "+(kind||"");clearTimeout(toastT);toastT=setTimeout(function(){t.className=""},kind==="err"?4200:1800)}
function save(x,field,value,prev){
  if(!WEBAPP_URL){toast("Saving isn’t set up yet, so this change shows on this phone only.","info");return}
  fetch(WEBAPP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:TOKEN,idea:x.name,row:x.row,field:field,value:value})})
   .then(function(r){return r.json().catch(function(){throw new Error("no connection")})}).then(function(j){if(!j||!j.ok)throw new Error(j&&j.error||"save failed");if(j.row)x.row=j.row;toast("Saved ✓","ok")})
   .catch(function(e){prev();render();toast("Couldn’t save ("+(e.message||"no connection")+"), so the change was undone.","err")});
}
document.getElementById("list").addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;var c=b.closest("article.card");if(!c)return;var x=items[+c.dataset.i];if(!x)return;
  var a=b.dataset.act;
  if(a==="details"){open[x.name]=!open[x.name];render();return}
  if(a==="status"){var v=b.dataset.v,old=x.status;if(statusOf(x)===v)return;x.status=v;render();save(x,"Status",v,function(){x.status=old});return}
  if(a==="like"||a==="nope"){var want=a==="like"?"Like":"Not for us",o=x.reaction,nv=o===want?"":want;x.reaction=nv;render();save(x,"Reaction",nv,function(){x.reaction=o});return}
  if(a==="hide"){var oh=x.hidden;x.hidden=!oh;render();toast(x.hidden?"Hidden. Find it under “Hidden” at the bottom.":"Back in the list","ok");save(x,"Hidden",x.hidden?"TRUE":"",function(){x.hidden=oh});return}
});
var SHORT={"Art & Craft":"Art","Sports & Outdoors":"Sports","Culture & Tours":"Culture","Restaurants":"Dining"};
function buildRow(id,field,values){
  var row=document.getElementById(id);row.querySelectorAll(".f").forEach(function(b){b.remove()});
  ["All"].concat(values).forEach(function(v){var b=document.createElement("button");b.className="f";b.textContent=(field==="cat"&&SHORT[v])||v;b.title=v;b.setAttribute("aria-label",v);b.setAttribute("aria-pressed",String(state[field]===v));
    b.onclick=function(){state[field]=v;row.querySelectorAll(".f").forEach(function(o){o.setAttribute("aria-pressed",String(o===b))});render();window.scrollTo({top:0,behavior:"smooth"})};row.appendChild(b)});
}
function uniq(f,order){var s={};items.forEach(function(x){if(x[f])s[x[f]]=1});var v=Object.keys(s);return v.sort(function(a,b){var ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b)})}
function start(data,live){
  items=data;
  buildRow("f-cat","cat",uniq("cat",Object.keys(CAT)));
  buildRow("f-who","who",["Couple","Friends","Both"]);
  buildRow("f-io","io",uniq("io",["Indoor","Both","Outdoor"]));
  var n=document.getElementById("notice");
  if(!live){n.style.display="block";n.textContent="Showing a saved copy. Live updates start once the sheet is shared as “Anyone with the link can view”."}else n.style.display="none";
  render();
}
document.getElementById("q").addEventListener("input",function(e){state.q=e.target.value.trim().toLowerCase();render()});
var done=false;
window.__onSheet=function(resp){if(done)return;try{if(resp.status==="error")throw 0;var d=fromGviz(resp);if(!d.length)throw 0;done=true;start(d,true)}catch(e){fallback()}};
function fallback(){if(done)return;done=true;start(fromObjects(SNAPSHOT),false)}
var s=document.createElement("script");
s.src="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json;responseHandler:__onSheet&headers=1&sheet="+encodeURIComponent(TAB)+"&_="+Date.now();
s.onerror=fallback;document.head.appendChild(s);setTimeout(fallback,8000);
})();
</script>
</body>
